name: Java CI with Maven

on:
  push:
    branches: [ "feature/session_1" ]  # Replace with your exact branch name
  pull_request:
    branches: [ "feature/session_1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Specify your required Java version
        distribution: 'temurin'
        cache: 'maven' # Caches Maven dependencies to speed up future builds

    - name: Build with Maven
      run: mvn clean package